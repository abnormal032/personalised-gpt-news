name: Restore saved feed state

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/restore-saved-feed.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact saved RSS content
        shell: bash
        run: |
          git show 5bdb8566854ef69f66478235d1f3246d2de1e382:rss.rss > /tmp/restored.rss
          cp /tmp/restored.rss rss.rss
          cp /tmp/restored.rss feed.xml

          grep -Fq '<atom:link href="https://pubsubhubbub.appspot.com/" rel="hub" />' feed.xml
          grep -Fq 'personalised-gpt-news-2026-08-16T21-12-44+12-00' feed.xml
          if grep -Fq 'websub-test-2026-08-16T21-48-00+12-00' feed.xml; then
            echo "Fresh WebSub test item is still present; refusing restore"
            exit 1
          fi
          cmp -s rss.rss feed.xml

      - name: Commit restored feed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.rss feed.xml
          git commit -m "Reinstate saved feed content"
          git push

      - name: Wait until GitHub Pages serves restored feed
        shell: bash
        env:
          TOPIC_URL: https://abnormal032.github.io/personalised-gpt-news/feed.xml
        run: |
          expected="$(sha256sum feed.xml | awk '{print $1}')"
          ready=false
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --location \
              "${TOPIC_URL}?restore_check=${GITHUB_RUN_ID}-${attempt}" \
              --output /tmp/public-feed.xml; then
              actual="$(sha256sum /tmp/public-feed.xml | awk '{print $1}')"
              if [ "$actual" = "$expected" ]; then
                ready=true
                break
              fi
            fi
            sleep 10
          done
          if [ "$ready" != "true" ]; then
            echo "GitHub Pages did not serve restored feed within 6 minutes"
            exit 1
          fi

      - name: Notify WebSub hub
        shell: bash
        env:
          TOPIC_URL: https://abnormal032.github.io/personalised-gpt-news/feed.xml
          HUB_URL: https://pubsubhubbub.appspot.com/
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "hub.mode=publish" \
            --data-urlencode "hub.url=${TOPIC_URL}" \
            "${HUB_URL}"
