name: Emergency RSS publisher

on:
  schedule:
    - cron: '45 11 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/emergency-news.yml

permissions:
  contents: write

concurrency:
  group: emergency-rss-publisher
  cancel-in-progress: false

jobs:
  emergency:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build emergency update only when needed
        shell: bash
        run: python3 .github/scripts/emergency_news.py

      - name: Commit synchronized feed if changed
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- rss.rss feed.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No feed changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.rss feed.xml
          git commit -m "Publish emergency personalised news"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Wait until GitHub Pages serves current feed
        shell: bash
        env:
          TOPIC_URL: https://abnormal032.github.io/personalised-gpt-news/feed.xml
        run: |
          expected="$(sha256sum feed.xml | awk '{print $1}')"
          ready=false

          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --location               "${TOPIC_URL}?emergency_check=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"               --output /tmp/public-feed.xml; then
              actual="$(sha256sum /tmp/public-feed.xml | awk '{print $1}')"
              if [ "$actual" = "$expected" ]; then
                ready=true
                break
              fi
            fi
            sleep 10
          done

          if [ "$ready" != "true" ]; then
            echo "GitHub Pages did not serve the current feed within 6 minutes."
            exit 1
          fi

      - name: Notify WebSub hub
        shell: bash
        env:
          TOPIC_URL: https://abnormal032.github.io/personalised-gpt-news/feed.xml
          HUB_URL: https://pubsubhubbub.appspot.com/
        run: |
          curl --fail --silent --show-error             --retry 3 --retry-all-errors             --header "Content-Type: application/x-www-form-urlencoded"             --data-urlencode "hub.mode=publish"             --data-urlencode "hub.url=${TOPIC_URL}"             "${HUB_URL}"
