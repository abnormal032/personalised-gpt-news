name: Add one WebSub test item

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-one-websub-test.yml

permissions:
  contents: write

jobs:
  add-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add exactly one fresh test item
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          rss_path = Path('rss.rss')
          feed_path = Path('feed.xml')
          rss = rss_path.read_text(encoding='utf-8')
          feed = feed_path.read_text(encoding='utf-8')

          if rss != feed:
              raise SystemExit('rss.rss and feed.xml are not identical; refusing to modify')

          guid = 'websub-test-2026-08-16T21-48-00+12-00'
          if guid in rss:
              raise SystemExit('Test GUID already exists; refusing to add a duplicate')

          rss = re.sub(
              r'(\t\t<pubDate>)[^<]+(</pubDate>)',
              r'\1Sun, 16 Aug 2026 21:48:00 +1200\2',
              rss,
              count=1,
          )

          marker = '\t\t<generator>ChatGPT</generator>\n\n'
          if marker not in rss:
              raise SystemExit('Generator marker not found; refusing to modify')

          item = '''\t\t<item>\n\t\t\t<guid isPermaLink="false">websub-test-2026-08-16T21-48-00+12-00</guid>\n\t\t\t<title>WebSub Push Test 21:48</title>\n\t\t\t<description><![CDATA[A fresh test item published after enabling WebSub push for the Feedly feed.]]></description>\n\t\t\t<content:encoded><![CDATA[<p>This is a fresh XML-only WebSub push test published at 21:48 NZ time. It is intentionally a brand-new GUID created after the push hub was enabled.</p>]]></content:encoded>\n\t\t\t<dc:creator><![CDATA[ChatGPT]]></dc:creator>\n\t\t\t<pubDate>Sun, 16 Aug 2026 21:48:00 +1200</pubDate>\n\t\t</item>\n\n'''

          rss = rss.replace(marker, marker + item, 1)
          rss_path.write_text(rss, encoding='utf-8')
          feed_path.write_text(rss, encoding='utf-8')
          PY

      - name: Commit test item
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.rss feed.xml
          git commit -m "Publish WebSub test item"
          git push
