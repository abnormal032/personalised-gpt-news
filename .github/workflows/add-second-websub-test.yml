name: Add second WebSub test item

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-second-websub-test.yml

permissions:
  contents: write

jobs:
  add-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add exactly one second WebSub test item
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          rss_path = Path('rss.rss')
          feed_path = Path('feed.xml')
          rss = rss_path.read_text(encoding='utf-8')
          feed = feed_path.read_text(encoding='utf-8')

          if rss != feed:
              raise SystemExit('rss.rss and feed.xml are not identical; refusing to modify')

          guid = 'websub-test-2-2026-08-16T21-57-00+12-00'
          if guid in rss:
              raise SystemExit('Second test GUID already exists; refusing to add a duplicate')

          hub = '\t\t<atom:link href="https://pubsubhubbub.appspot.com/" rel="hub" />'
          if hub not in rss:
              raise SystemExit('Expected WebSub hub metadata is missing')

          rss = re.sub(
              r'(\t\t<pubDate>)[^<]+(</pubDate>)',
              r'\1Sun, 16 Aug 2026 21:57:00 +1200\2',
              rss,
              count=1,
          )

          marker = '\t\t<generator>ChatGPT</generator>\n\n'
          if marker not in rss:
              raise SystemExit('Generator marker not found; refusing to modify')

          item = '''\t\t<item>\n\t\t\t<guid isPermaLink="false">websub-test-2-2026-08-16T21-57-00+12-00</guid>\n\t\t\t<title>WebSub Push Test 21:57</title>\n\t\t\t<description><![CDATA[A second fresh test item published to verify WebSub delivery after restoring the original feed.]]></description>\n\t\t\t<content:encoded><![CDATA[<p>This is the second fresh WebSub push test, published at 21:57 NZ time after the original feed content was restored. It uses a brand-new GUID so Feedly can treat it as a genuinely new item.</p>]]></content:encoded>\n\t\t\t<dc:creator><![CDATA[ChatGPT]]></dc:creator>\n\t\t\t<pubDate>Sun, 16 Aug 2026 21:57:00 +1200</pubDate>\n\t\t</item>\n\n'''

          rss = rss.replace(marker, marker + item, 1)
          rss_path.write_text(rss, encoding='utf-8')
          feed_path.write_text(rss, encoding='utf-8')
          PY

      - name: Commit second test item
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.rss feed.xml
          git commit -m "Publish second WebSub test item"
          git push

      - name: Wait until GitHub Pages serves second test
        shell: bash
        env:
          TOPIC_URL: https://abnormal032.github.io/personalised-gpt-news/feed.xml
        run: |
          expected="$(sha256sum feed.xml | awk '{print $1}')"
          ready=false
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --location \
              "${TOPIC_URL}?websub_test2=${GITHUB_RUN_ID}-${attempt}" \
              --output /tmp/public-feed.xml; then
              actual="$(sha256sum /tmp/public-feed.xml | awk '{print $1}')"
              if [ "$actual" = "$expected" ]; then
                ready=true
                break
              fi
            fi
            sleep 10
          done
          if [ "$ready" != "true" ]; then
            echo "GitHub Pages did not serve the second test feed within 6 minutes"
            exit 1
          fi

      - name: Notify WebSub hub
        shell: bash
        env:
          TOPIC_URL: https://abnormal032.github.io/personalised-gpt-news/feed.xml
          HUB_URL: https://pubsubhubbub.appspot.com/
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "hub.mode=publish" \
            --data-urlencode "hub.url=${TOPIC_URL}" \
            "${HUB_URL}"
